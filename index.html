<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#15122B">
<title>眠仓计划</title>
<meta name="description" content="匹配 6 人宿舍，躺下赚金币和电力，造 25 种建筑，每局随机天赋、随机建筑和不同的猛鬼，赶在它越砸越强之前把它打死。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="眠仓计划">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: phone-first one-screen game — vertical dorm map on canvas (drag to pan), HUD on top, player switcher bar at bottom, bottom sheets for building/settings */
:root{
  --night:#15122B; --panel:rgba(26,21,56,.94); --panel-2:#2B2458; --panel-3:#1B1640; --edge:#0B091D;
  --text:#F5F2FF; --soft:#B8B1DE; --coin:#FFD23F; --volt:#4FE3FF; --danger:#FF4D6D; --heal:#5CE08A; --rage:#FF9A3C;
  --f-display:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-num:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--text);overflow:hidden;font-family:var(--f-body);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#game.dragging{cursor:grabbing}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px dashed var(--coin);outline-offset:3px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.coin,.volt{display:inline-block;width:1em;height:1em;flex:none;vertical-align:-.15em}
.coin{border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF0A0 0 18%,var(--coin) 20%);border:2px solid #A8710E}
.volt{background:var(--volt);clip-path:polygon(55% 0,10% 58%,45% 58%,35% 100%,90% 40%,55% 40%,70% 0)}

/* ---------- HUD ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.top > *{width:100%;max-width:560px}
.row{display:flex;align-items:center;gap:6px}
.me-av{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--edge);background:var(--panel-2);box-shadow:0 3px 0 var(--edge);flex:none}
.pill{display:flex;align-items:center;gap:5px;background:var(--panel);border:2.5px solid var(--edge);border-radius:999px;padding:3px 10px 3px 7px;box-shadow:0 3px 0 var(--edge);min-width:0}
.pill b{font-family:var(--f-num);font-weight:800;font-size:1.08rem;line-height:1.35;font-variant-numeric:tabular-nums}
.pill small{font-family:var(--f-num);font-weight:600;font-size:.68rem;color:var(--soft);white-space:nowrap}
.pill.time{margin-left:auto;gap:4px;padding:3px 10px}
.pill.time small{font-family:var(--f-body)}
.icon-btn{pointer-events:auto;width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;border:2.5px solid var(--edge);background:var(--panel-2);box-shadow:0 3px 0 var(--edge);cursor:pointer;padding:0}
.icon-btn svg{width:19px;height:19px}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.ghostbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;background:var(--panel);border:2.5px solid var(--edge);border-radius:14px;padding:4px 10px;box-shadow:0 3px 0 var(--edge)}
.gname{font-family:var(--f-display);font-size:1rem;letter-spacing:.04em;white-space:nowrap}
.gname b{font-family:var(--f-num);font-weight:800;color:var(--danger);font-size:.95rem}
.bars{display:flex;flex-direction:column;gap:3px;min-width:0}
.bar{height:9px;border-radius:99px;background:#100D26;border:2px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF4D6D,#FF8FA3);border-radius:99px;transition:width .2s}
.xbar{height:4px;border-radius:99px;background:#100D26;overflow:hidden}
.xbar i{display:block;height:100%;width:0;background:var(--rage);border-radius:99px;transition:width .2s}
#gstate{font-size:.74rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw;text-align:right}
.ghostbar.alarm{animation:alarm .5s ease-in-out infinite alternate;border-color:#5A0F1F}
@keyframes alarm{from{box-shadow:0 3px 0 var(--edge),0 0 0 0 rgba(255,77,109,0)}to{box-shadow:0 3px 0 var(--edge),0 0 22px 3px rgba(255,77,109,.6)}}
.visit{pointer-events:auto;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--panel);border:2.5px solid var(--edge);border-radius:16px;padding:6px 8px;box-shadow:0 3px 0 var(--edge);animation:pop .25s cubic-bezier(.3,1.5,.5,1)}
.visit img{width:44px;height:44px;border-radius:50%;background:var(--panel-2);border:2px solid var(--edge)}
.visit b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visit small{display:block;font-size:.72rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visit button{border:2.5px solid var(--edge);background:var(--coin);color:#2A1A00;border-radius:12px;padding:7px 10px;font-weight:700;font-size:.85rem;cursor:pointer;box-shadow:0 3px 0 var(--edge);white-space:nowrap}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

/* ---------- bottom: player switcher ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px}
.hint{pointer-events:none;margin:0;background:rgba(11,9,29,.8);border-radius:999px;padding:5px 14px;font-size:.84rem;text-align:center;max-width:min(560px,100%)}
.hint b{color:var(--coin);font-weight:600}
.strip{pointer-events:auto;display:flex;gap:6px;width:100%;max-width:560px;background:var(--panel);border:2.5px solid var(--edge);border-radius:20px;padding:6px;box-shadow:0 4px 0 var(--edge)}
.players{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;flex:1;min-width:0}
.pb{position:relative;min-width:0;padding:3px 0 5px;border:2.5px solid var(--edge);border-radius:12px;background:var(--panel-2);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .15s}
.pb img{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;display:block}
.pb .hpb{width:78%;height:4px;border-radius:9px;background:#100D26;overflow:hidden}
.pb .hpb i{display:block;height:100%;width:100%;background:var(--heal);border-radius:9px}
.pb .tag{position:absolute;top:-7px;right:-3px;font-size:.6rem;font-weight:700;line-height:1.3;background:var(--coin);color:#2A1A00;border-radius:6px;padding:0 4px;border:2px solid var(--edge)}
.pb.focus{border-color:var(--coin);background:#3E3270;transform:translateY(-2px)}
.pb.dead img{filter:grayscale(1) brightness(.55)}
.pb.dead::after{content:"✕";position:absolute;inset:0 0 10px;display:grid;place-items:center;color:var(--danger);font-weight:800;font-size:1.2rem}
.pb.target{animation:target .5s ease-in-out infinite alternate}
.pb .atk{display:none;position:absolute;top:-8px;left:-4px;font-size:.6rem;font-weight:800;line-height:1.3;background:var(--danger);color:#fff;border-radius:6px;padding:0 4px;border:2px solid var(--edge);z-index:1}
.pb.target .atk{display:block}
@keyframes target{from{box-shadow:0 0 0 0 rgba(255,77,109,0)}to{box-shadow:0 0 14px 3px rgba(255,77,109,.85);border-color:#7A1630}}
.pb .bub{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translate(-50%,4px);background:#fff;color:#1A1534;font-size:.62rem;font-weight:800;line-height:1.35;padding:1px 6px;border-radius:8px;border:2px solid var(--edge);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:2}
.pb .bub::after{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--edge)}
.pb .bub.show{opacity:1;transform:translate(-50%,0)}
.pb .bub.sos{background:var(--danger);color:#fff;animation:sosBob .5s ease-in-out infinite alternate}
@keyframes sosBob{to{transform:translate(-50%,-3px)}}
.sos-btn{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 98px);z-index:6;pointer-events:auto;border:3px solid var(--edge);background:var(--danger);color:#fff;font-weight:800;font-size:.95rem;border-radius:999px;padding:8px 14px;box-shadow:0 4px 0 var(--edge);cursor:pointer;animation:pop .25s cubic-bezier(.3,1.5,.5,1)}
.sos-btn[disabled]{background:#5A3A4A;color:#E8C8D0;cursor:default}
.sos-btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.visit .vbtns{display:flex;gap:6px}
.visit button.give{background:#FF8FB8;color:#3A0A20}
.visit button[disabled]{opacity:.5}
.mapbtn{flex:0 0 50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:2.5px solid var(--edge);border-radius:12px;background:#3B3170;cursor:pointer;box-shadow:0 3px 0 var(--edge)}
.mapbtn svg{width:22px;height:22px}
.mapbtn b{font-size:.68rem;font-weight:700}
.mapbtn:active,.pb:active{transform:translateY(2px)}
.feed{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 124px);list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:4px;pointer-events:none;z-index:3;max-width:min(330px,70vw)}
.feed li{background:rgba(11,9,29,.78);border-radius:10px;padding:3px 10px;font-size:.76rem;color:var(--soft);animation:feedIn .3s ease}
.feed li.bad{color:#FFB3C0}.feed li.good{color:#A8F0C0}
@keyframes feedIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* ---------- banner ---------- */
.banner{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;font-family:var(--f-display);font-size:clamp(1.35rem,6vw,2.2rem);letter-spacing:.06em;padding:.25em .9em;border-radius:18px;border:3px solid var(--edge);background:var(--panel);box-shadow:0 6px 0 var(--edge);white-space:nowrap;opacity:0;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
.banner.show{animation:bannerIn 2.3s ease forwards}
.banner.danger{background:#5A1426;color:#FFE1E7}
.banner.good{background:#174A35;color:#DFFFEA}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

/* ---------- sheets ---------- */
.sheet{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);width:min(460px,calc(100% - 20px));max-height:min(60vh,580px);overflow:auto;overscroll-behavior:contain;z-index:7;background:var(--panel);border:3px solid var(--edge);border-radius:22px;box-shadow:0 6px 0 var(--edge);padding:12px;animation:sheetIn .25s cubic-bezier(.3,1.4,.5,1)}
@keyframes sheetIn{from{transform:translate(-50%,30px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.35rem;letter-spacing:.04em;white-space:nowrap}
.sheet-head .res{display:flex;gap:10px;font-family:var(--f-num);font-weight:800;font-size:.95rem;margin-left:auto}
.sheet-head .res span{display:flex;align-items:center;gap:4px}
.x{width:34px;height:34px;border-radius:50%;border:3px solid var(--edge);background:var(--panel-2);cursor:pointer;font-size:.95rem;line-height:1;flex:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.tabs button{border:2.5px solid var(--edge);background:var(--panel-3);border-radius:12px;padding:6px 4px;cursor:pointer;font-weight:600;font-size:.88rem}
.tabs button[aria-pressed="true"]{background:var(--coin);color:#2A1A00}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;padding:7px 10px;border-radius:14px;border:2.5px solid var(--edge);background:var(--panel-2);cursor:pointer;box-shadow:0 3px 0 var(--edge);transition:transform .1s}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.opt[disabled]{cursor:not-allowed}
.opt[disabled] > *{opacity:.5}
.opt img{width:44px;height:44px;display:block}
.opt b{font-size:1rem;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.opt b i.tier{background:transparent;color:var(--tc);border:2px solid var(--tc);padding:0 5px}
.opt b i{font-style:normal;font-size:.64rem;font-weight:700;padding:1px 6px;border-radius:99px;background:#16345A;color:var(--volt);white-space:nowrap}
.opt b i.c{background:#4A3A10;color:var(--coin)}
.opt b i.m{background:#2E2A50;color:#D8D2FF}
.opt small{display:block;font-size:.76rem;color:var(--soft);line-height:1.4}
.opt small em{font-style:normal;font-weight:700}.opt small em.ok{color:var(--heal)}.opt small em.no{color:#FFB3C0}
.opt small .ltd{display:inline-block;margin-right:5px;padding:0 6px;border-radius:99px;background:#5A1E46;color:#FF9AD5;font-size:.64rem;font-weight:800;vertical-align:1px}
.cost{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-family:var(--f-num);font-weight:800;font-size:.95rem}
.cost span{display:flex;align-items:center;gap:4px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--panel-3);border-radius:12px;padding:6px 10px;min-width:0}
.stat small{display:block;font-size:.74rem;color:var(--soft)}
.stat b{font-family:var(--f-num);font-weight:800;font-size:1.05rem}
.stat b em{font-style:normal;color:var(--heal);font-size:.86rem}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap}
.act{flex:1 1 140px;white-space:nowrap;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border-radius:14px;border:3px solid var(--edge);background:var(--coin);color:#2A1A00;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--edge)}
.act .num{font-weight:800}
.act.alt{background:var(--panel-2);color:var(--text)}
.act.heal{background:var(--heal);color:#06301A}
.act[disabled]{opacity:.5;cursor:not-allowed}
.act:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.note{font-size:.76rem;color:var(--soft);margin:8px 2px 0;line-height:1.5}
.toggles{display:grid;gap:8px;margin-bottom:12px}
.slider{display:grid;grid-template-columns:5.5em minmax(0,1fr) 2.6em;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--panel-3);font-size:1rem}
.slider b{font-family:var(--f-num);font-weight:800;text-align:right;font-size:.95rem}
.slider input{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--heal) var(--p,50%),#3A3466 var(--p,50%));border:2px solid var(--edge);margin:0}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--edge);cursor:pointer}
.slider input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--edge);cursor:pointer}
.me-wrap{position:relative;flex:none;display:block}
.me-tal{position:absolute;right:-6px;bottom:-5px;background:var(--panel-2);border:2px solid var(--edge);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.me-tal img{width:16px;height:16px}
.gtal{font-family:var(--f-body);font-size:.66rem;font-weight:800;color:#FFC2CE;background:#4A1426;border:2px solid var(--edge);border-radius:8px;padding:0 5px;margin-left:5px;vertical-align:2px;letter-spacing:0;white-space:nowrap}
.talents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;padding:6px 2px 4px}
.tal{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 7px 12px;border:3px solid var(--edge);border-radius:var(--wob);background:linear-gradient(var(--tc) 0 46px,var(--panel-2) 46px);box-shadow:var(--hi),0 6px 0 var(--edge);cursor:pointer;min-height:210px;animation:dealIn .45s cubic-bezier(.3,1.4,.5,1) both;transition:transform .15s,opacity .2s}
.tal:nth-child(1){--rot:-3deg}.tal:nth-child(2){--rot:0deg;animation-delay:.1s}.tal:nth-child(3){--rot:3deg;animation-delay:.2s}
.tal{transform:rotate(var(--rot))}
@keyframes dealIn{from{opacity:0;transform:translateY(60px) rotate(calc(var(--rot) * -4)) scale(.7)}}
.tal:active{transform:rotate(var(--rot)) translateY(4px);box-shadow:var(--hi),0 2px 0 var(--edge)}
.tal-cat{margin-top:6px;font-family:var(--f-display);font-size:.9rem;letter-spacing:.1em;color:#2A1A00}
.tal-ic{width:66px;height:66px;border-radius:50%;background:var(--panel-3);border:3px solid var(--edge);display:grid;place-items:center;box-shadow:0 3px 0 var(--edge)}
.tal-ic img{width:46px;height:46px}
.tal b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.25rem;letter-spacing:.04em;color:var(--text);margin-top:2px}
.tal small{display:block;color:var(--soft);font-size:.76rem;line-height:1.45}
.tal.picked{transform:rotate(0) scale(1.06);box-shadow:var(--hi),0 6px 0 var(--edge),0 0 0 4px var(--coin),0 0 26px 4px rgba(255,210,63,.55)}
.talents.done .tal:not(.picked){opacity:.35;transform:rotate(var(--rot)) scale(.94)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel-3);cursor:pointer;border:0;width:100%;text-align:left;font-size:1rem}
.toggle i{width:46px;height:26px;border-radius:99px;background:#3A3466;position:relative;flex:none;border:2px solid var(--edge);transition:background .2s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] i{background:var(--heal)}
.toggle[aria-pressed="true"] i::after{transform:translateX(20px)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:radial-gradient(ellipse at 50% 30%,rgba(43,30,90,.72),rgba(10,8,24,.94));overflow:auto}
#shareview,#meta{z-index:11}
#settings{z-index:13}
#title{background:radial-gradient(ellipse at 50% 45%,rgba(13,10,32,.62),rgba(10,8,24,.88) 75%)}
.card{margin:auto 0;width:min(460px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(3.8rem,19vw,7rem);line-height:1;margin:0;color:var(--coin);letter-spacing:.04em;-webkit-text-stroke:3px var(--edge);paint-order:stroke fill;text-shadow:0 6px 0 var(--edge),0 0 40px rgba(255,210,63,.35);display:flex}
.logo span{display:inline-block;animation:logoBob 2.4s ease-in-out infinite}
.logo span:nth-child(2){animation-delay:-.3s}.logo span:nth-child(3){animation-delay:-.6s;color:#FF8FA3}.logo span:nth-child(4){animation-delay:-.9s;color:#FF8FA3}
@keyframes logoBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.tag{font-size:1rem;color:var(--soft);margin:0}
.how{font-size:.82rem;color:var(--soft);margin:6px 0 0;background:rgba(11,9,29,.6);border-radius:999px;padding:6px 14px}
.btn{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.04em;padding:.45em 1.1em;border-radius:999px;border:3px solid var(--edge);background:var(--coin);color:#2A1A00;box-shadow:0 5px 0 var(--edge);cursor:pointer;transition:transform .12s,box-shadow .12s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.big{font-size:1.6rem;padding:.45em 1.8em}
.btn.alt{background:var(--panel-2);color:var(--text)}
.small{font-size:.8rem;color:var(--soft);margin:0}
.match-title{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:0;letter-spacing:.06em}
.match-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.mslot{background:var(--panel);border:3px solid var(--edge);border-radius:var(--wob);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px;justify-content:center;box-shadow:var(--hi),0 4px 0 var(--edge)}
.mslot img{width:60px;height:60px;border-radius:50%;background:var(--panel-2);border:2px solid var(--edge);animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.mslot b{font-size:.82rem;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mslot.me{border-color:#7A5600;background:#3A2F5E}
.mslot .wait{width:60px;height:60px;border-radius:50%;border:3px dashed #4A4380;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.end-title{font-family:var(--f-display);font-weight:400;font-size:clamp(2.8rem,13vw,4.6rem);line-height:1.05;margin:0;-webkit-text-stroke:3px var(--edge);paint-order:stroke fill;text-shadow:0 6px 0 var(--edge)}
.end-title.win{color:var(--coin)}.end-title.lose{color:var(--danger)}
.end-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.end-stats div{background:var(--panel);border:3px solid var(--edge);border-radius:16px;padding:8px 12px;text-align:left}
.end-stats small{display:block;color:var(--soft);font-size:.76rem}
.end-stats b{font-family:var(--f-num);font-weight:800;font-size:1.35rem}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mcoin{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2.5px solid var(--edge);border-radius:999px;padding:3px 12px;box-shadow:0 3px 0 var(--edge);font-size:.9rem}
.mcoin b{font-family:var(--f-num);font-weight:800;font-size:1.05rem;color:#FFE58A}
.meta-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.mbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:16px;border:3px solid var(--edge);background:var(--panel-2);box-shadow:0 4px 0 var(--edge);cursor:pointer;font-weight:700;font-size:.9rem}
.mbtn img{width:34px;height:34px}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.mbtn .dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--danger);border:2.5px solid var(--edge)}
.meta-card{margin:auto 0;width:min(480px,100%);max-height:calc(100vh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));flex:none;display:flex;flex-direction:column;gap:10px;background:var(--panel);border:3px solid var(--edge);border-radius:22px;box-shadow:0 6px 0 var(--edge);padding:12px;text-align:left}
.meta-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;display:flex;flex-direction:column;gap:10px;min-height:0}
.meta-sec h4{margin:4px 2px 6px;font-size:.95rem;color:var(--soft);font-weight:700}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.skin{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 6px;border-radius:14px;border:2.5px solid var(--edge);background:var(--panel-2);cursor:pointer;font-size:.82rem}
.skin img{width:64px;height:40px;display:block;border-radius:8px}
.skin img.av{width:44px;height:44px;border-radius:50%;margin:-2px 0}
.skin small{font-family:var(--f-num);font-weight:800;color:#FFE58A;font-size:.8rem}
.skin small.own{color:var(--soft);font-family:var(--f-body);font-weight:600}
.skin.on{border-color:var(--coin);background:#4A3A10}
.skin.on small{color:var(--coin)}
.task,.ach{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel-3)}
.task b,.ach b{display:block;font-size:.95rem}
.task small,.ach small{display:block;color:var(--soft);font-size:.76rem;margin-top:2px}
.task .pbar{height:7px;border-radius:9px;background:#100D26;overflow:hidden;margin-top:6px}
.task .pbar i{display:block;height:100%;background:var(--heal);border-radius:9px}
.claim{border:2.5px solid var(--edge);background:var(--coin);color:#2A1A00;border-radius:12px;padding:6px 12px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 var(--edge)}
.claim[disabled]{background:var(--panel-2);color:var(--soft);box-shadow:none;cursor:default}
.ach.lock{opacity:.55}
.ach .rw{font-family:var(--f-num);font-weight:800;color:#FFE58A;white-space:nowrap}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translate(-50%,-20px);z-index:12;pointer-events:none;background:#3A2A08;color:#FFE9A0;border:3px solid var(--edge);border-radius:16px;box-shadow:0 5px 0 var(--edge);padding:8px 16px;font-weight:800;white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.earn{font-weight:800;color:#FFE58A;margin:0}
.share-img{width:min(320px,80vw);border-radius:16px;border:3px solid var(--edge);box-shadow:0 6px 0 var(--edge);-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.fr-gold{box-shadow:0 0 0 3px #FFD23F!important}
.fr-rainbow{box-shadow:0 0 0 2px #FF4D6D,0 0 0 4px #FFD23F,0 0 0 6px #4FE3FF!important}
.fr-fire{box-shadow:0 0 0 3px #FF7A2A,0 0 12px 3px rgba(255,122,42,.85)!important}
.fr-ice{box-shadow:0 0 0 3px #7FE7FF,0 0 12px 3px rgba(127,231,255,.8)!important}
.fr-heart{box-shadow:0 0 0 3px #FF8FB8,0 0 10px 2px rgba(255,143,184,.8)!important}
.fr-night{box-shadow:0 0 0 3px #B98CFF,0 0 12px 3px rgba(185,140,255,.8)!important}
.fr-leaf{box-shadow:0 0 0 3px #5CE08A,0 0 0 5px #2E7A32!important}
.fr-sun{box-shadow:0 0 0 3px #FFD23F,0 0 12px 4px rgba(255,154,60,.85)!important}
.fr-ocean{box-shadow:0 0 0 3px #2B8FFF,0 0 0 5px #BFE8FF!important}
.fr-candy{box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px #FF8FB8,0 0 0 6px #FFFFFF!important}
.fr-shadow{box-shadow:0 0 0 3px #1A1030,0 0 14px 4px rgba(107,79,216,.9)!important}
.fr-crown{box-shadow:0 0 0 3px #FFD23F,0 0 0 6px #B8862A,0 0 16px 5px rgba(255,210,63,.8)!important}

/* ---------- lobby & pre-match stage (full-height game screens) ---------- */
.overlay.lobby,.overlay.stage{display:block;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
#title.lobby{background:linear-gradient(rgba(10,8,24,.35),rgba(10,8,24,0) 24%,rgba(10,8,24,0) 72%,rgba(10,8,24,.5))}
.lobby-wrap,.stage-wrap{width:min(480px,100%);min-height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.lobby-top{width:100%;display:flex;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:8px;text-align:left;background:var(--panel);border:3px solid var(--edge);border-radius:var(--wob);padding:4px 12px 4px 4px;box-shadow:var(--hi),0 3px 0 var(--edge);min-width:0;cursor:pointer}
.who img{width:42px;height:42px;border-radius:50%;flex:none}
.who b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.05rem;letter-spacing:.04em}
.who small{display:block;font-size:.72rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who:active{transform:translateY(2px)}
.lobby-top .mcoin{margin-left:auto;flex:none}
.who{flex:1 1 0;overflow:hidden}
.who > span{min-width:0;overflow:hidden}
.who b,.who small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lobby-top .icon-btn{flex:none}
.lobby-top .icon-btn{width:44px;height:44px;position:relative}
.lobby-top .icon-btn img{width:30px;height:30px}
.lobby-top .icon-btn .dot{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:var(--danger);border:2.5px solid var(--edge)}
.lobby-top .mcoin{padding:3px 10px}
.lobby-hero{flex:1;display:flex;align-items:flex-start;justify-content:center;width:100%;min-height:200px;padding-top:44px}
.sign{position:relative;padding:20px 22px 16px;text-align:center;background:linear-gradient(#3B2E7A,#251C55);border:4px solid var(--edge);border-radius:28px 34px 26px 32px/32px 26px 34px 28px;box-shadow:var(--hi),var(--lo),0 8px 0 var(--edge),0 0 70px rgba(255,210,63,.2);animation:swing 4.5s ease-in-out infinite;transform-origin:50% -40px}
.sign::before,.sign::after{content:"";position:absolute;top:-36px;width:5px;height:36px;border-radius:3px;background:#5A4636;border:2px solid var(--edge)}
.sign::before{left:20%}.sign::after{right:20%}
@keyframes swing{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.sign .logo{font-size:clamp(3.3rem,16.5vw,6rem);justify-content:center}
.sign .tag{margin-top:8px;font-size:.92rem}
.peek{position:absolute;right:-24px;top:-34px;width:68px;height:68px;animation:peek 3.2s ease-in-out infinite}
@keyframes peek{0%,100%{transform:translateY(0) rotate(10deg)}50%{transform:translateY(-9px) rotate(-4deg)}}
.tip{width:100%;margin:0;display:flex;align-items:center;gap:10px;background:rgba(11,9,29,.72);border:2.5px dashed #4A4380;border-radius:var(--wob);padding:8px 12px;font-size:.84rem;color:var(--soft);min-height:44px;text-align:left}
.tip b{flex:none;font-family:var(--f-display);font-weight:400;color:#2A1A00;background:var(--coin);border:2px solid var(--edge);border-radius:8px;padding:0 6px;font-size:.82rem;letter-spacing:.04em}
.tip span{animation:feedIn .35s ease}
.lobby-cta{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.btn.start{width:100%;font-size:2rem;padding:.38em 0;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03)}}
.lobby-cta .btn.alt{width:100%}
.stage-head{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px}
.ribbon{position:relative;padding:0 26px}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:12px;bottom:-10px;width:44px;background:#C98A1A;border:3px solid var(--edge)}
.ribbon::before{left:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,38% 50%)}
.ribbon::after{right:0;clip-path:polygon(0 0,100% 0,62% 50%,100% 100%,0 100%)}
.ribbon h2{position:relative;z-index:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.5rem,7vw,2.1rem);letter-spacing:.06em;color:#2A1A00;background:var(--coin);border:3px solid var(--edge);padding:.16em 1em;border-radius:10px 14px 9px 13px;box-shadow:var(--hi),var(--lo),0 5px 0 var(--edge);white-space:nowrap}
.count{margin:0;font-family:var(--f-num);font-weight:800;font-size:1rem;color:var(--soft);background:rgba(11,9,29,.7);border-radius:999px;padding:2px 14px}
.stage-body{flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:10px 0}
.stage-foot{width:100%;display:flex;flex-direction:column;gap:10px}
.timer{height:16px;border-radius:99px;background:#100D26;border:3px solid var(--edge);overflow:hidden;box-shadow:0 3px 0 var(--edge)}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF4D6D,#FFD23F);border-radius:99px}
.intel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.intel > div{background:var(--panel);border:3px solid var(--edge);border-radius:var(--wob);padding:8px 10px;box-shadow:var(--hi),0 4px 0 var(--edge);min-width:0;text-align:left}
.intel small{display:block;font-size:.72rem;color:var(--soft)}
.intel b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.02rem;letter-spacing:.03em}
.gintel{display:flex;align-items:center;gap:8px}
.gintel img{width:40px;height:40px;flex:none}
.mates{display:flex;margin-top:4px}
.mates img{width:26px;height:26px;border-radius:50%;border:2px solid var(--edge);margin-right:-6px;background:var(--panel-2)}
#tal-reroll{width:100%}
#tal-reroll[disabled]{opacity:.45}
.talents .tal{min-height:max(260px,min(330px,40vh));padding-bottom:16px;justify-content:flex-start}
.talents .tal-ic{width:74px;height:74px}
.talents .tal-ic img{width:52px;height:52px}

/* ---------- hand-drawn sticker skin for every button ---------- */
:root{--wob:18px 23px 16px 24px / 23px 16px 24px 18px;--wob-pill:32px 40px 30px 38px / 38px 30px 40px 32px;--hi:inset 0 3px 0 rgba(255,255,255,.26);--lo:inset 0 -4px 0 rgba(0,0,0,.16)}
.btn{border-radius:var(--wob-pill);box-shadow:var(--hi),var(--lo),0 5px 0 var(--edge);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:active{box-shadow:var(--hi),0 1px 0 var(--edge)}
.act,.opt,.mbtn,.skin,.claim,.tabs button,.visit button,.sos-btn,.mapbtn,.pb,.toggle,.slider,.task,.ach,.stat,.end-stats div,.visit,.ghostbar{border-radius:var(--wob)}
.act,.mbtn,.claim,.visit button,.sos-btn,.tabs button{font-family:var(--f-display);font-weight:400;letter-spacing:.05em}
.act{font-size:1.05rem;box-shadow:var(--hi),var(--lo),0 4px 0 var(--edge)}
.act .num{font-family:var(--f-num)}
.act:active:not([disabled]){box-shadow:var(--hi),0 1px 0 var(--edge)}
.mbtn{font-size:1.02rem;box-shadow:var(--hi),var(--lo),0 4px 0 var(--edge)}
.claim{font-size:.98rem;box-shadow:var(--hi),var(--lo),0 3px 0 var(--edge)}
.tabs button{font-size:1.02rem;box-shadow:0 3px 0 var(--edge)}
.tabs button[aria-pressed="true"]{box-shadow:var(--hi),var(--lo),0 3px 0 var(--edge)}
.opt,.skin{box-shadow:var(--hi),0 3px 0 var(--edge)}
.mapbtn{box-shadow:var(--hi),var(--lo),0 3px 0 var(--edge)}
.mapbtn b{font-family:var(--f-display);font-weight:400;font-size:.78rem}
.icon-btn,.x{box-shadow:var(--hi),var(--lo),0 3px 0 var(--edge);display:grid;place-items:center;padding:0}
.x{color:var(--text)}
.visit button{font-size:.95rem;box-shadow:var(--hi),var(--lo),0 3px 0 var(--edge)}
.sos-btn{display:flex;align-items:center;gap:6px;font-size:1.05rem;box-shadow:var(--hi),var(--lo),0 4px 0 var(--edge)}
img.ui-i{width:1.3em;height:1.3em;display:inline-block;vertical-align:-.3em;flex:none}
.mcoin img.ui-i{width:1.35em;height:1.35em}

@media (max-width:380px){
  .who > span{display:none}
  .who{flex:none;padding:4px}
  .lobby-top{gap:6px}
}
@media (max-width:400px){
  .pill small{display:none}
  .pill{padding:3px 8px 3px 6px}
  .mapbtn{flex-basis:44px}
}
@media (prefers-reduced-motion: reduce){
  .logo span,.ghostbar.alarm,.mslot .wait,.pb.target{animation:none}
}
</style>

<body>
<canvas id="game" aria-label="眠仓计划游戏画面"></canvas>

<header class="top" id="top" hidden>
  <div class="row">
    <span class="me-wrap"><img class="me-av" id="me-av" alt="我的头像"><span class="me-tal" id="me-tal" hidden></span></span>
    <div class="pill"><i class="coin"></i><b id="coins">0</b><small id="income"></small></div>
    <div class="pill"><i class="volt"></i><b id="power">0</b><small id="pincome"></small></div>
    <div class="pill time"><small id="time-label">选房</small><b id="clock">0:20</b></div>
    <button class="icon-btn" id="gear" type="button" aria-label="暂停与设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M8 5v14M16 5v14"/></svg></button>
  </div>
  <div class="ghostbar" id="ghostbar">
    <span class="gname"><span id="gname">猛鬼</span> <b id="glv">Lv.1</b><span class="gtal" id="gtal" hidden></span></span>
    <div class="bars"><div class="bar"><i id="ghp"></i></div><div class="xbar" title="砸门越多升级越快"><i id="gxp"></i></div></div>
    <span id="gstate">还没出动</span>
  </div>
  <div class="visit" id="visit" hidden>
    <img id="visit-av" alt="">
    <div><b id="visit-name"></b><small id="visit-info"></small></div>
    <span class="vbtns"><button type="button" class="give" id="visit-give" hidden>送金币</button><button type="button" id="visit-back">回我房间</button></span>
  </div>
</header>

<ul class="feed" id="feed" aria-live="polite"></ul>
<div class="dock" id="dock">
  <p class="hint" id="hint" hidden></p>
  <div class="strip" id="strip" hidden>
    <div class="players" id="players"></div>
    <button class="mapbtn" id="view" type="button" aria-label="切换全图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><b id="view-label">全图</b></button>
  </div>
</div>
<button class="sos-btn" id="sos" type="button" hidden><img class="ui-i" data-ui="mega" alt=""><span id="sos-t">求救</span></button>
<div class="banner" id="banner"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-head"><h3 id="sheet-title"></h3><div class="res" id="sheet-res"></div><button class="x" id="sheet-close" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
  <div id="sheet-body"></div>
</div>

<div class="sheet" id="settings" hidden>
  <div class="sheet-head"><h3 id="set-title">已暂停</h3><span class="small" id="pause-info" style="margin-left:auto"></span><button class="x" id="set-close" type="button" aria-label="继续游戏"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
  <div class="toggles">
    <label class="slider"><span>背景音乐</span><input type="range" id="v-music" min="0" max="100" step="5" aria-label="背景音乐音量"><b id="v-music-n"></b></label>
    <label class="slider"><span>音效</span><input type="range" id="v-sfx" min="0" max="100" step="5" aria-label="音效音量"><b id="v-sfx-n"></b></label>
    <label class="slider"><span>语音播报</span><input type="range" id="v-voice" min="0" max="100" step="5" aria-label="语音音量"><b id="v-voice-n"></b></label>
    <button class="toggle" type="button" id="t-vib" aria-pressed="true">被砸门时震动<i></i></button>
  </div>
  <div class="sheet-actions">
    <button class="act" type="button" id="resume">继续游戏</button>
    <button class="act alt" type="button" id="restart">重新匹配</button>
    <button class="act alt" type="button" id="to-title">回到首页</button>
  </div>
</div>

<div class="overlay lobby" id="title">
  <div class="lobby-wrap">
    <div class="lobby-top">
      <button class="who" id="who" type="button" aria-label="换个造型"><img id="lobby-av" alt=""><span><b id="lobby-rank">新手</b><small id="lobby-sub">段位</small></span></button>
      <span class="mcoin"><img class="ui-i" data-ui="moon" alt=""><b id="meta-coins">0</b></span>

  const en = o.pay === "e" ? curve(P0 * .28, 2.25, 8) : o.pay === "m" ? curve(Math.max(5, P0 * .07), 2.2, 8) : curve(Math.max(5, P0 * .05), 2.2, 8, 3);
  return Object.assign({ max: 8, cost, en, prop: true }, o);
}

// basic buildings are in every match; the rest is a random pool so each match plays differently
const CORE = ["turret", "arcade", "dynamo", "cat", "repair", "fridge"], WEAPON_PICK = 6, OTHER_PICK = 7;
let avail = new Set(Object.keys(BUILD));
// weapons are drawn by quality weight (legendary is rare), so some nights you get a great arsenal and some nights you make do
function rollPool() {
  let weps = [];
  for (let tries = 0; tries < 40; tries++) {
    let pool = ATTACKERS.filter(k => !CORE.includes(k)); weps = [];
    while (weps.length < WEAPON_PICK && pool.length) {
      let r = Math.random() * pool.reduce((a, k) => a + TIERS[BUILD[k].tier].w, 0), k = pool[pool.length - 1];
      for (const x of pool) { if ((r -= TIERS[BUILD[x].tier].w) < 0) { k = x; break; } }
      weps.push(k); pool = pool.filter(x => x !== k);
    }
    if (weps.some(k => BUILD[k].cost[0]) && weps.some(k => !BUILD[k].cost[0] || BUILD[k].en[0])) break;
  }
  weps.sort((a, b) => BUILD[a].tier - BUILD[b].tier || priceOf(a) - priceOf(b));
  const oth = ["eco", "def", "aux"].flatMap(cat => shuffle(Object.keys(BUILD).filter(k => !CORE.includes(k) && BUILD[k].cat === cat)).slice(0, 3));
  avail = new Set([...CORE, ...weps, ...oth]);
  return { weps, oth };
}

function npcStep(r, step) {

  if (step === "door") return r.doorLv >= DOOR.max ? true : doorUp(r);

    const pickW = weps.find(k => !r.slots.some(sl => sl.b && sl.b.type === k)) || weps[0];
    const slot = bestSlot(r, pickW); if (!slot) return true;
    return build(r, slot, pickW);
  }
  if (step.startsWith("any:")) {
    const cat = step.slice(4), list = [...avail].filter(k => BUILD[k].cat === cat && BUILD[k].prop && !r.slots.some(sl => sl.b && sl.b.type === k)); if (!list.length) return true;
    const k = list.sort((a, b) => priceOf(a) - priceOf(b))[0], slot = bestSlot(r, k); if (!slot) return true;
    return build(r, slot, k);
  }
  if (step === "up:any") {
    const list = r.slots.filter(sl => sl.b && BUILD[sl.b.type].cat !== "atk" && sl.b.lv < BUILD[sl.b.type].max); if (!list.length) return true;
    list.sort((a, b) => a.b.lv - b.b.lv); return upBuild(r, list[0]);
  }
  if (step === "up:atk") {
    const list = r.slots.filter(sl => sl.b && BUILD[sl.b.type].cat === "atk" && sl.b.type !== "turret" && sl.b.lv < BUILD[sl.b.type].max);
    if (!list.length) return true; list.sort((a, b) => a.b.lv - b.b.lv); return upBuild(r, list[0]);
  }
  if (step.startsWith("up:")) {
    const type = step.slice(3); if (!avail.has(type)) return true;
    const list = r.slots.filter(s => s.b && s.b.type === type && s.b.lv < BUILD[type].max);
    if (!list.length) return true;
    list.sort((a, b) => a.b.lv - b.b.lv); return upBuild(r, list[0]);

}
function updateBot(p, dt) {
  if (p.state !== "bed" || !p.room.alive) return;
  p.think -= dt; if (p.think > 0) return;
  p.think = rand(1.1, 2.2) * (p.thinkMul || 1);
  const r = p.room, plan = p.plan;
  if (!p.noRepair && G.target === r && G.state === "attack" && r.doorHp < doorMax(r) * .35) { if (repairDoor(r) || doorUp(r)) return; }
  if (Math.random() < p.lazy) return;
  const i = p.pi < plan.length ? p.pi : LOOP_FROM + (p.pi - LOOP_FROM) % (plan.length - LOOP_FROM);
  if (npcStep(r, plan[i])) { p.pi++; p.stuck = 0; }
  else if ((p.stuck += 1) > 14) { p.pi++; p.stuck = 0; }
}

function canDo(act) {

  if (act === "door") return canUpDoor(r);

}
